name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: estoque_test
          POSTGRES_USER: estoque_test
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U estoque_test -d estoque_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://estoque_test:ci_ephemeral_password@127.0.0.1:5432/estoque_test
      AUTH_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
